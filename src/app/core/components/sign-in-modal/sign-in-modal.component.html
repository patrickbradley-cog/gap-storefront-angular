<div class="scrim" *ngIf="open$ | async" (click)="close()" aria-hidden="true"></div>
<div
  class="modal"
  *ngIf="open$ | async"
  role="dialog"
  aria-modal="true"
  aria-labelledby="signin-title"
>
  <button type="button" class="modal__close" aria-label="Close sign in" (click)="close()">
    &times;
  </button>
  <h2 id="signin-title">Sign in</h2>
  <p class="modal__sub">Mock account — any e-mail and a 6+ character password signs you in.</p>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>Email address</span>
      <input type="email" formControlName="email" autocomplete="email" />
      <small class="field__error" *ngIf="invalid('email')">Enter a valid email address.</small>
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      <small class="field__error" *ngIf="invalid('password')">
        Password must be at least 6 characters.
      </small>
    </label>
    <button type="submit" class="btn btn--primary btn--block">Sign in</button>
  </form>
  <p class="modal__fine">
    By signing in you agree this is only a demo. No credentials are sent anywhere.
  </p>
</div>
