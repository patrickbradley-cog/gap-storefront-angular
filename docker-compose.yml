# Database services for the catalog API.
#
# Start both with: npm --prefix server run db:up
#
#   oracle   — Oracle XE 21c catalog store (GAPCAT schema).
#              Seed: npm --prefix server run seed:oracle
#              Serve: CATALOG_SOURCE=oracle npm --prefix server start
#   postgres — PostgreSQL 16 catalog store (gapcat database).
#              Seed: npm --prefix server run seed:postgres
#              Serve: CATALOG_SOURCE=postgres npm --prefix server start
#
# Postgres 16 here stands in for GCP Cloud SQL for PostgreSQL / AlloyDB —
# same engine.

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: gap-catalog-oracle
    ports:
      - '1521:1521'
    environment:
      ORACLE_PASSWORD: gapdemo
      APP_USER: GAPCAT
      APP_USER_PASSWORD: GAPDEMO
    volumes:
      - oracle-data:/opt/oracle/oradata

  postgres:
    image: postgres:16-alpine
    container_name: gap-catalog-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: gapcat
      POSTGRES_PASSWORD: gapdemo
      POSTGRES_DB: gapcat
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  oracle-data:
  postgres-data:
