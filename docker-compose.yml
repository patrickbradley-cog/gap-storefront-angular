# Database services for the catalog API.
#
#   oracle   — the "legacy" catalog store (Oracle XE 21c, GAPCAT schema).
#              Seed it with: npm --prefix server run seed:oracle
#   postgres — the migration target (Postgres 16, gapcat db/user). Same tables
#              as Oracle, DDL in server/postgres/schema.sql.
#              Seed it with: npm --prefix server run seed:postgres
#
# Postgres 16 here stands in for GCP Cloud SQL for PostgreSQL / AlloyDB —
# same engine, same DDL.

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: gap-catalog-oracle
    ports:
      - '1521:1521'
    environment:
      ORACLE_PASSWORD: gapdemo
      APP_USER: GAPCAT
      APP_USER_PASSWORD: GAPDEMO
    volumes:
      - oracle-data:/opt/oracle/oradata

  postgres:
    image: postgres:16-alpine
    container_name: gap-catalog-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: gapcat
      POSTGRES_PASSWORD: gapdemo
      POSTGRES_DB: gapcat
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  oracle-data:
  postgres-data:
